name: language usage slice

on:
  push:
    branches:
      - agent/language-usage-slice-20260928
  pull_request:
    branches:
      - main

concurrency:
  group: language-usage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  usage-contract:
    name: usage contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build usability commands
        run: |
          go build ./cmd/gooo-usecase
          go build ./cmd/gooo-contract
          go build ./cmd/gooo-feedback
          go build ./cmd/gooo-complete
          go build ./cmd/gooo-lsp
          go build ./cmd/gooo-generate
          go build ./cmd/gooo-evaluate
      - name: Exercise declaration workflows
        shell: bash
        run: |
          generated="$RUNNER_TEMP/support-triage.generated.gooo"
          go run ./cmd/gooo-generate examples/support-triage/usecase.gooo "$generated"
          test -s "$generated"
          go run ./cmd/gooo-complete examples/support-triage/partial.gooo pro > "$RUNNER_TEMP/completion.json"
          jq -e '.response.non_executing == true and .response.non_authorizing == true and ([.response.items[] | select(.label == "property")] | length) == 1' "$RUNNER_TEMP/completion.json"
          go run ./cmd/gooo-lsp < examples/support-triage/completion.jsonl > "$RUNNER_TEMP/lsp.jsonl"
          jq -e '.completion.non_executing == true and .completion.non_authorizing == true and .completion.source_digest != ""' "$RUNNER_TEMP/lsp.jsonl"