name: Go

on:
  push:
    branches: [main, "agent/jev-execution-envelope-dev-20260926-r1"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.23", "1.27.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Test
        run: go test -timeout 20m ./...
